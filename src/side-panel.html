<!DOCTYPE html>
<html id="popup" class="is-side-panel">
	<head>
		<meta charset="UTF-8">
		<title>Obsidian Web Clipper</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body id="popup-container">
		<div id="popup-header">
			<div id="template-container">
				<select id="template-select">
					<option value=""></option>
				</select>
			</div>
			<div class="popup-actions">
                <div class="popup-tools">
                    <button type="button" id="popup-tools-toggle" class="clickable-icon" data-i18n-title="more" aria-label="More" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
                    <div id="popup-tools-menu" role="menu" hidden>
                        <a href="#" id="show-variables" role="menuitem"><i data-lucide="braces"></i><span data-i18n="showPageVariables"></span></a>
                        <a href="#" id="highlighter-mode" role="menuitem"><i data-lucide="highlighter"></i><span data-i18n="highlightPage"></span></a>
                        <a href="#" id="embedded-mode" role="menuitem"><i data-lucide="picture-in-picture-2"></i><span data-i18n="openEmbedded"></span></a>
                        <a href="#" id="reader-mode" role="menuitem"><i data-lucide="book-open"></i><span data-i18n="qiaomuReadingMode"></span></a>
                        <a href="#" id="edit-clip-markdown" role="menuitem"><i data-lucide="file-text"></i><span data-i18n="qiaomuEditMarkdown"></span></a>
                        <a href="#" id="refresh-pane" role="menuitem"><i data-lucide="rotate-cw"></i><span data-i18n="refresh"></span></a>
                        <a href="https://rss.qiaomu.ai/feeds/user-submitted.xml" target="_blank" rel="noopener noreferrer" role="menuitem"><i data-lucide="rss"></i><span data-i18n="qiaomuPublicRss"></span></a>
                    </div>
                </div>
                <a href="#" id="open-settings" class="clickable-icon" data-i18n-title="settings"><i data-lucide="settings"></i></a>
            </div>
		</div>
		<p class="error-message" style="display: none;"></p>
		<div class="clipper">
			<textarea id="note-name-field" type="text" data-i18n="noteName" rows="1"></textarea>
			<div class="metadata-properties-header collapsed" role="button" tabindex="0" aria-expanded="false">
				<span data-i18n="properties"></span>
				<i data-lucide="chevron-down"></i>
			</div>
			<div class="metadata-properties collapsed"></div>
			<div id="note-content-container">
                <div class="clip-content-actions" role="group" data-i18n-aria-label="qiaomuContentActions">
                    <button type="button" id="preview-clip" class="clickable-icon" data-i18n-title="qiaomuReadingMode" data-i18n-aria-label="qiaomuReadingMode"><i data-lucide="eye"></i></button>
                    <button type="button" id="copy-content" class="clickable-icon" data-i18n-title="qiaomuCopyMarkdown" data-i18n-aria-label="qiaomuCopyMarkdown"><i data-lucide="copy"></i></button>
                    <button type="button" id="save-downloads" class="clickable-icon" data-i18n-title="qiaomuSaveMarkdown" data-i18n-aria-label="qiaomuSaveMarkdown"><i data-lucide="download"></i></button>
                </div>
                <p id="clip-action-status" role="status" aria-live="polite"></p>
				<textarea id="note-content-field" rows="4" data-i18n="notesAboutPage"></textarea>
			</div>
			<div class="clipper-footer">
				<div class="vault-path-container">
					<div id="vault-container" style="display: none;">
						<select id="vault-select"></select>
					</div>
					<input id="path-name-field" type="text" data-i18n="folder"/>
				</div>
				<div id="interpreter" style="display: none;">
					<textarea id="prompt-context" rows="3"></textarea>
					<div class="interpreter-controls">
						<select id="model-select" style="display: none;"></select>
						<button id="interpret-btn" data-i18n="interpret"></button>
						<span id="interpreter-timer" style="display: none;"></span>
					</div>
					<div id="token-counter" class="token-counter"></div>
					<div id="interpreter-error" style="display: none;"></div>
				</div>
				<div class="qiaomu-rss-control">
					<div id="qiaomu-local-status" role="status" aria-live="polite"></div>
					<button type="button" id="qiaomu-local-retry" hidden>重试本地保存</button>
					<label for="qiaomu-rss-enabled"><input type="checkbox" id="qiaomu-rss-enabled"><span data-i18n="qiaomuShareRss">分享到乔木 RSS</span></label>
					<div id="qiaomu-rss-status" role="status" aria-live="polite"></div>
					<button type="button" id="qiaomu-rss-retry" hidden>重试 RSS 同步</button>
				</div>
				<div class="action-buttons" id="action-buttons">
					<button id="clip-btn" class="mod-cta"><!-- Text set by determineMainAction --></button>
				</div>
			</div>
		</div>
		<script type="module" src="popup.js"></script>
	</body>
</html>
