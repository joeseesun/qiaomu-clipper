name: Native ASR compatibility
on:
  push:
    paths:
      - 'native/asr*.py'
      - 'native/test_asr*.py'
      - '.github/workflows/native-asr.yml'
  pull_request:
    paths:
      - 'native/asr*.py'
      - 'native/test_asr*.py'
      - '.github/workflows/native-asr.yml'
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s native -p 'test_asr_install.py'
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s native -p 'test_*.py'
