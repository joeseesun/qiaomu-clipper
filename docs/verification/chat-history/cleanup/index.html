<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>乔木剪藏 · 删除清理验证</title><link rel="stylesheet" href="fixture.css"><style>
body{margin:0;background:#ededed;color:#222;font:14px/1.6 system-ui}main{max-width:1000px;margin:40px auto;padding:0 24px;display:grid;grid-template-columns:1fr 440px;gap:40px}h1{font-size:25px;margin-top:0}button{padding:8px 12px;border:1px solid #aaa;border-radius:6px;background:#fafafa;color:#222;cursor:pointer}#result{font-size:11px;white-space:pre-wrap;max-height:440px;overflow:auto} .clip-chat{position:relative!important;inset:auto!important;display:flex!important;width:auto!important;height:570px!important;min-width:0!important;max-width:none!important;border:1px solid #ccc;border-radius:12px;box-shadow:none!important;background:#fff} .clip-chat-history{top:50px!important;max-height:calc(100% - 70px)!important}.clip-chat button{color:#333}.test-header{padding:10px 14px;display:flex;gap:12px;align-items:center}.test-header strong{margin-right:auto}.clip-chat-link{color:#333!important}#selection{padding:20px;color:#666}.clip-chat-history[aria-busy=true]{opacity:.7}
</style><main><section><h1>对话删除与清理</h1><p>使用真实生产模块和独立的测试数据库。所有内容均为合成数据，不读取或删除你的对话、图片和设置。</p><p>清空只删除对话拥有的数据。图库、其他对话仍使用的图片会保留；失败后可以关闭窗口再重试。</p><p><button id="run">准备验证</button> <button id="fault">模拟图片清理失败</button></p><pre id="result">点击运行，完成自动核验后可操作右侧真实历史组件。</pre></section><section class="clip-chat"><div class="test-header"><strong>AI 对话</strong><button id="history-button" title="历史对话">历史对话</button></div><div id="selection"></div><div id="history" class="clip-chat-history" hidden></div></section></main><script src="fixture.js"></script></html>
