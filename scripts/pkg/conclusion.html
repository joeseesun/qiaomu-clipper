<html><head><meta charset="utf-8"></head><body style="font-family:-apple-system,sans-serif"><h2>装好了</h2>
<p>最后一步：打开浏览器的 <b>chrome://extensions</b>，找到「乔木剪藏」，点一下「重新加载」，再回到笔记里点「重试」。</p>
<p>如果是先装了这个助手、后装（或换了）浏览器里的扩展，需要让助手重新认一次扩展：在扩展设置里点「复制安装指令」发给 AI，或在终端运行 <code>/Library/QiaomuClipper/bin/qiaomu-helper</code>。</p>
<p>如果仍然提示未连接，把这行发给 AI 或在终端运行即可查看原因：<br><code>/Library/QiaomuClipper/bin/qiaomu-helper --check</code></p></body></html>
