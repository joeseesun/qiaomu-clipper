<p>它只在需要时启动，不常驻后台。笔记保存在本机；下载音频和模型需要联网，云端识别只在你选择后使用。安装包自带 Python，无需提前安装。</p><p>X 完整阅读是可选功能，安装助手不会自动下载 Grok。需要时在插件设置 → 可选功能中查看网络、账号和下载要求，再按需设置。不需要输入命令。</p></body></html>
